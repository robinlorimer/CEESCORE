function pad(n){ return n.toString().padStart(2,'0'); }
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
setInterval(tick, 1000);
tick();

function stampUpdated(){
  const d = new Date();
  document.getElementById('updated').textContent =
    pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}

function truncate(s, n){
  return s.length > n ? s.slice(0, n-1) + "." : s;
}

function goalLabel(g){
  let mark = "";
  if(g.og) mark = ' <span class="og">(og)</span>';
  else if(g.pen) mark = ' (pen)';
  return `${g.p} ${g.t}'${mark}`;
}

function renderResults(){
  let html = '<div class="row" style="justify-content:center;margin-bottom:4px;"><span class="magenta">LATEST RESULTS — FULL TIME</span></div>';
  results.forEach(m=>{
    html += `<div class="match">
      <span class="status">${m.status}</span>
      <span class="home">${truncate(m.home,14)}</span>
      <span class="score">${m.hs}</span>
      <span class="dash">-</span>
      <span class="score">${m.as}</span>
      <span class="away">${truncate(m.away,14)}</span>
    </div>`;
    const ghTxt = m.gh.map(goalLabel).join(", ");
    const gaTxt = m.ga.map(goalLabel).join(", ");
    if(ghTxt || gaTxt){
      html += `<div class="goals-row">
        <span></span>
        <span class="g-home">${ghTxt}</span>
        <span class="g-away">${gaTxt}</span>
      </div>`;
    }
  });
  html += '<hr class="sep">';
  html += '<div class="row" style="justify-content:center;"><span class="green">ALL FIXTURES FT — SEE P303 FOR FIXTURES</span></div>';
  document.getElementById('page-body').innerHTML = html;
}

function renderFixtures(){
  let html = '<div class="row" style="justify-content:center;margin-bottom:4px;"><span class="magenta">UPCOMING FIXTURES</span></div>';
  fixtures.forEach(m=>{
    html += `<div class="match">
      <span class="status live">${m.when.split(" ").slice(0,2).join(" ")}</span>
      <span class="home">${truncate(m.home,14)}</span>
      <span class="score">v</span>
      <span class="dash"></span>
      <span class="score"></span>
      <span class="away">${truncate(m.away,14)} <span style="color:#00ffff;font-size:12px;">${m.when.split(" ").slice(2).join(" ")}</span></span>
    </div>`;
  });
  html += '<hr class="sep">';
  html += '<div class="row" style="justify-content:center;"><span class="green">SEE P302 FOR LATEST RESULTS</span></div>';
  document.getElementById('page-body').innerHTML = html;
}

function renderTable(){
  let html = '<div class="row" style="justify-content:center;margin-bottom:4px;"><span class="magenta">PREMIER LEAGUE TABLE</span></div>';
  html += `<div class="table-row head">
    <span></span><span>TEAM</span><span class="num">P</span><span class="num">W</span><span class="num">D</span><span class="num">PTS</span>
  </div>`;
  table.forEach((t,i)=>{
    const rank = i+1;
    let cls = 'table-row';
    if(rank <= 4) cls += ' top4';
    if(rank >= 18) cls += ' bottom3';
    html += `<div class="${cls}">
      <span class="rank">${rank}</span>
      <span>${truncate(t.team,14)}</span>
      <span class="num">${t.p}</span>
      <span class="num">${t.w}</span>
      <span class="num">${t.d}</span>
      <span class="pts">${t.pts}</span>
    </div>`;
  });
  html += '<hr class="sep">';
  html += '<div class="row" style="justify-content:center;"><span class="green">GREEN=TOP 4 · RED=BOTTOM 3</span></div>';
  document.getElementById('page-body').innerHTML = html;
}

let currentPage = 'results';
function renderCurrent(){
  if(currentPage === 'results') renderResults();
  else if(currentPage === 'fixtures') renderFixtures();
  else if(currentPage === 'support') renderSupport();
  else renderTable();
}

function renderSupport(){
  const html = `
    <div class="row" style="justify-content:center;margin-bottom:6px;"><span class="magenta">SUPPORT CEESCORE</span></div>
    <div class="support-copy">
      CEESCORE is a one-page labour of love, kept<br>
      running on <span class="hl">tea</span>, <span class="hl">nostalgia</span> and the occasional<br>
      late-night rebuild after a crazy matchday.<br><br>
      If you enjoy the page, you can help keep the<br>
      lights on with a small donation below.
    </div>
    <a class="donate-btn" href="https://ko-fi.com" target="_blank" rel="noopener">&#9670; DONATE &#9670;</a>
    <div class="support-note">Link is a placeholder — swap in your own Ko-fi,<br>PayPal or Buy Me a Coffee URL.</div>
    <hr class="sep">
    <div class="row" style="justify-content:center;"><span class="green">THANKS FOR WATCHING — SEE P302</span></div>
  `;
  document.getElementById('page-body').innerHTML = html;
}

document.querySelectorAll('#nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPage = btn.dataset.page;
    document.getElementById('page-num').textContent = 'P' + btn.dataset.num;
    renderCurrent();
    stampUpdated();
  });
});

renderResults();
stampUpdated();

// --- Live data layer ---------------------------------------------------
// Pulls fresh data from our own /api/* serverless proxies (they hold the
// API-Football key server-side). On any failure the page keeps showing the
// last good data.
async function fetchLive(){
  try {
    const [r, f, t] = await Promise.all([
      fetch('/api/results').then(x => x.ok ? x.json() : null),
      fetch('/api/fixtures').then(x => x.ok ? x.json() : null),
      fetch('/api/table').then(x => x.ok ? x.json() : null),
    ]);
    if (r && r.results && r.results.length) results = r.results;
    if (f && f.fixtures && f.fixtures.length) fixtures = f.fixtures;
    if (t && t.table && t.table.length) table = t.table;
    renderCurrent();
    stampUpdated();
  } catch (err) {
    console.warn('Live fetch failed, keeping last known data:', err);
  }
}
fetchLive();
setInterval(fetchLive, 30000);

// --- Fit to viewport (iPhone Duo: cover ~382px wide, inner up to ~951px) ---
// Re-runs whenever the viewport changes, so folding/unfolding or rotating
// rescales the page live.
const tvEl = document.getElementById('tv');
function fitTV(){
  const cs = getComputedStyle(document.body);
  const avail = document.body.clientWidth
    - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const k = Math.max(0.6, Math.min(avail / 480, 2.0));
  tvEl.style.setProperty('--k', k.toFixed(3));
}
fitTV();
window.addEventListener('resize', fitTV);
window.addEventListener('orientationchange', fitTV);

// --- Keyboard + accessibility (Mac, iPad keyboards, Vision Pro, VoiceOver) ---
// Type a page number (302, 303, 301, 695), press R/G/Y/C for the coloured
// FastText buttons, or use the left/right arrow keys to flip pages.
const pageBtns = Array.from(document.querySelectorAll('#nav button'));
function markCurrent(btn){
  pageBtns.forEach(b => b.removeAttribute('aria-current'));
  btn.setAttribute('aria-current', 'page');
}
pageBtns.forEach(b => b.addEventListener('click', () => markCurrent(b)));
markCurrent(pageBtns[0]);
let typedDigits = '', typedTimer;
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const colourKeys = { r: 0, g: 1, y: 2, c: 3 };
  const key = e.key.toLowerCase();
  if (/^[0-9]$/.test(key)) {
    typedDigits += key;
    clearTimeout(typedTimer);
    typedTimer = setTimeout(() => { typedDigits = ''; }, 2000);
    if (typedDigits.length === 3) {
      const hit = pageBtns.find(b => b.dataset.num === typedDigits);
      typedDigits = '';
      if (hit) hit.click();
    }
  } else if (key in colourKeys) {
    pageBtns[colourKeys[key]].click();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const cur = pageBtns.findIndex(b => b.getAttribute('aria-current') === 'page');
    const step = e.key === 'ArrowRight' ? 1 : -1;
    pageBtns[(cur + step + pageBtns.length) % pageBtns.length].click();
  }
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitTV);
</script>
