<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: #000;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: 'VT323', 'Consolas', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    /* keep clear of the Dynamic Island / rounded corners / home indicator */
    padding:

      calc(env(safe-area-inset-right, 0px) + 6px)
      0
      calc(env(safe-area-inset-left, 0px) + 6px);
  }
  /* The teletext "screen" is a fixed 480px-wide grid that gets zoomed to fit
     whatever the viewport is (382px cover display -> 951px inner display).
     --k is set by fitTV() in the script below. */
  :root { --k: 0.8; --ko-col: 52px; }
  #tv {
    zoom: var(--k);
    width: 480px;
    flex: 1 0 auto;
    background: #000;
    padding: 10px 12px 8px;
  }
  .scanlines {
    position: relative;
  }
  .scanlines::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 2px,
      transparent 3px

    pointer-events: none;

  .row { display: flex; white-space: pre-wrap; text-align: center; font-size: 24px; line-height: 1.3; }

  .header-row .logo { justify-self: center; }
  .header-row #clock { justify-self: end; }
  .cyan { color: #00ffff; }
  .yellow { color: #ffff00; }
  .white { color: #ffffff; }
  .green { color: #00ff00; }
  .magenta { color: #ff00ff; }
  .red { color: #ff2222; }

  #page-num { color: #ffffff; font-size: 26px; }
  #clock { color: #ffffff; font-size: 26px; }

  .logo {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #000;
    padding: 1px 8px;
  }
  .logo .icon {
    width: 22px;
    height: 22px;
    display: block;
  }
  .logo .name { color:#ffffff; font-size: 26px; letter-spacing: 1px; }

  .title-block {
    text-align: center;
    color: #ffff00;
    font-size: 40px;
    letter-spacing: 4px;
    transform: scaleY(1.4);
    margin: 4px 0 14px;
  }
  .subtitle {
    text-align: center;
    color: #00ffff;
    background: #0000cc;
    font-size: 24px;
    padding: 2px 0;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }
  hr.sep {
    border: none;
    border-top: 3px double #fff;
    margin: 4px 0 6px;
    opacity: 0.9;
  }

  .match {
    display: grid;
    grid-template-columns: var(--ko-col) 1fr 26px 12px 26px 1fr;
    align-items: baseline;
    font-size: 24px;
    line-height: 1.35;
    color: #ffffff;
  }
  .match .status { color: #00ff00; font-size: 18px; }
  .match .status.live { color: #ff2222; }
  .match .status.ko { color: #00ffff; }
  .match .home { text-align: right; padding-right: 6px; }
  .match .away { padding-left: 6px; }
  .match .score { color: #ffff00; font-weight: bold; text-align: center; }
  .match .dash { color: #ffff00; text-align: center; }

  .goals-row {
    display: grid;
    grid-template-columns: var(--ko-col) 1fr 1fr;
    font-size: 15px;
    line-height: 1.4;
    color: #00ff00;
    margin-bottom: 3px;
  }
  .goals-row .g-home { text-align: right; padding-right: 6px; }
  .goals-row .g-away { padding-left: 6px; grid-column: 3; }
  .goals-row .og { color: #ff8800; }

  #nav { display: flex; }
  /* Bottom bar: last child of the flex-column body, so it is pinned to the bottom of the
     screen on short pages and sticks there on long ones, without ever covering content. */
  #bar {
    position: sticky; bottom: 0; z-index: 10; align-self: stretch;
    background: #000;
    display: flex; justify-content: center;
    padding: 0 0 env(safe-area-inset-bottom, 0px);
  }
  .bar-inner { zoom: var(--k); width: 480px; flex: none; padding: 0 12px; }
  #nav button {
    flex: 1 1 0;
    min-width: 0;
    min-height: calc(44px / var(--k, 1));
    font-family: inherit;
    border: none;
    padding: 6px 0;
    font-size: 18px;
    letter-spacing: 0;
    cursor: pointer;
    color: #000;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 0;
  }

  #nav button:nth-child(2) { background: #00ff00; }
  #nav button:nth-child(3) { background: #ffff00; }
  #nav button:nth-child(4) { background: #00ffff; }
  #nav button:nth-child(5) { background: #ffffff; }
  #nav button.active { outline: 3px solid #ffffff; outline-offset: -3px; }

  .flash { animation: flash 1s steps(1) infinite; }
  @keyframes flash { 50% { opacity: 0; } }

  .footer-note {
    text-align: center;
    color: #00ffff;
    font-size: 16px;
    margin-top: 0;
    padding: 4px 0;

    line-height: 1.3;

  .err-btn {

    border: none; border-radius: 0; font-family: inherit; font-size: 24px; letter-spacing: 2px;
    min-height: calc(44px / var(--k, 1)); cursor: pointer; touch-action: manipulation;
    -webkit-appearance: none; appearance: none;
  }
  .err-btn.retry { background: #ffff00; color: #000000; }
  .err-btn.saved { background: #0000cc; color: #ffffff; }
  .err-btn:focus-visible { outline: 3px solid #ffffff; outline-offset: -3px; }
  .err-photo {
    display: block; margin: 8px auto 4px; width: 160px; height: 200px;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 2px solid #ffffff; background: #000;
  }
  /* ---- Fixtures grouped by day ---- */
  .day-head { color: #00ffff; background: #0000cc; font-size: 22px; letter-spacing: 2px; padding: 0 8px; margin: 8px 0 2px; }
  /* ---- Live Updates page ---- */
  .goal-line { font-size: 20px; line-height: 1.35; color: #ffffff; padding: 0 6px; }
  .goal-line .min { color: #ffff00; }
  .goal-line .tm { color: #00ffff; }
  /* ---- Competition tabs ---- */
  #comps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-bottom: 6px; }
  #comps button {
    font-family: inherit; font-size: 18px; line-height: 1.1; letter-spacing: 0;
    background: #0000cc; color: #00ffff; border: none; border-radius: 0;
    padding: 4px 2px; min-height: calc(44px / var(--k, 1)); min-width: 0;
    cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none;
  }
  #comps button.active { background: #00ffff; color: #000000; }
  #comps button:focus-visible { outline: 3px solid #ffffff; outline-offset: -3px; }
  /* ---- Asterisk notes (Man City) ---- */
  .city-star {
    position: relative; font: inherit; color: #00ffff; background: none; border: 0; padding: 0 2px; margin: 0;
    cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none;
  }
  .city-star::after { content: ''; position: absolute; inset: -12px -10px; }   /* bigger tap target */
  .city-star:focus-visible { outline: 2px solid #ffffff; }
  #note {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.82);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #note[hidden] { display: none; }
  .note-inner {
    zoom: var(--k); width: 456px; background: #0000cc; border: 3px solid #ffffff; color: #ffffff;
    max-height: calc((100vh - 24px) / var(--k, 1));

  .note-band { background: #ff0000; color: #ffffff; text-align: center; font-size: 24px; letter-spacing: 2px; padding: 2px 6px; }
  .note-body { font-size: 22px; line-height: 1.35; padding: 8px 10px 4px; }

  .note-body .hl { color: #ffff00; }
  .note-src { color: #00ffff; font-size: 16px; padding: 0 10px 6px; }

  button#clock, button#page-num {

  button#clock::after, button#page-num::after { content: ''; position: absolute; inset: -10px -8px; }
  button#clock:focus-visible, button#page-num:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

  .page-title { text-align: center; color: #ff00ff; font-size: 24px; line-height: 1.3; margin-bottom: 4px; }

  .page-foot  { text-align: center; color: #00ff00; font-size: 24px; line-height: 1.3; }
</style>

function goalLabel(g){

function matchRows(list, isLive){
  let html = '';
  list.forEach(m=>{
    html += `<div class="match">
      <span class="status${isLive ? ' live' : ''}">${m.status}</span>
      <span class="home">${teamHtml(m.home)}</span>
      <span class="score">${m.hs}</span>
      <span class="dash">-</span>
      <span class="score">${m.as}</span>
      <span class="away">${teamHtml(m.away)}</span>
    </div>`;
    const ghTxt = (m.gh || []).map(goalLabel).join(", ");
    const gaTxt = (m.ga || []).map(goalLabel).join(", ");
    if(ghTxt || gaTxt){
      html += `<div class="goals-row">
        <span></span>
        <span class="g-home">${ghTxt}</span>
        <span class="g-away">${gaTxt}</span>
      </div>`;
    }
  });
  return html;
}

function goalsRowHtml(m){
  const ghTxt = (m.gh || []).map(goalLabel).join(", ");
  const gaTxt = (m.ga || []).map(goalLabel).join(", ");
  return (ghTxt || gaTxt)
    ? `<div class="goals-row"><span></span><span class="g-home">${ghTxt}</span><span class="g-away">${gaTxt}</span></div>`
    : '';
}
// Today's date in London, written the way the fixtures write theirs: "SAT 07 NOV"
function londonToday(){
  return new Date().toLocaleString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', timeZone: 'Europe/London' })
    .toUpperCase().replace(/,/g, '').replace(/\s+/g, ' ').trim();
}
const dayKey = w => String(w || '').replace(/,/g, '').trim().split(/\s+/).slice(0, 3).join(' ');

// ---- Shared page furniture: titles, footers, empty states, match rows ----
const PAGES = { results: ['LIVE &amp; RESULTS', '302'], fixtures: ['FIXTURES', '303'], table: ['TABLE', '301'] };
const pageTitle = t => `<div class="page-title">${t}</div>`;

const emptyState = msg => `<div class="err-copy">${msg}<br>CHECK BACK SOON.</div>`;
// Footer: optional notes, then links to the other pages
function pageFoot(current, notes){
  const links = Object.keys(PAGES).filter(k => k !== current).map(k => `${PAGES[k][0]} P${PAGES[k][1]}`).join(' · ');
  return `<hr class="sep">${notes || ''}<div class="page-foot">${links}</div>`;
}
const dayHead = (day, isToday) => `<div class="day-head">${isToday ? 'TODAY - ' : ''}${day || 'DATE TBC'}</div>`;

// One match, whether finished, in play, or still to come (fixtures use it too)
function matchRowHtml(m){
  const time = splitWhen(m.when).time;
  const started = m.live || m.final;
  const off = ['PST', 'CANC', 'ABD'].includes(m.status);
  const cls = m.live ? 'status live' : m.final ? 'status' : 'status ko';
  const label = m.live ? m.status : m.final ? 'FT' : off ? m.status : (time || '');
  return `<div class="match">
      <span class="${cls}">${label}</span>
      <span class="home">${teamHtml(m.home)}</span>
      <span class="score">${started ? m.hs : ''}</span>
      <span class="dash">${started ? '-' : 'v'}</span>
      <span class="score">${started ? m.as : ''}</span>
      <span class="away">${teamHtml(m.away)}</span>
    </div>` + goalsRowHtml(m);
}

// Group a kick-off-ordered list into days
function groupByDay(list){
  const groups = [];
  list.forEach(m => {
    const key = dayKey(m.when);
    let g = groups[groups.length - 1];
    if (!g || g.key !== key) { g = { key, day: splitWhen(m.when).day, items: [] }; groups.push(g); }
    g.items.push(m);
  });
  return groups;
}

function weekRows(list){
  const groups = groupByDay(list);
  // Order them for the person reading: today first, then days still to come,
  // then earlier days with the most recent first.
  const todayKey = londonToday();
  const isDone = g => g.items.every(m => m.final || ['PST', 'CANC', 'ABD'].includes(m.status));
  const today = groups.find(g => g.key === todayKey);
  const rest = groups.filter(g => g !== today);
  const ordered = [...(today ? [today] : []), ...rest.filter(g => !isDone(g)), ...rest.filter(isDone).reverse()];
  let html = '';
  ordered.forEach(g => {
    html += dayHead(g.day, g === today);
    // on today's list, games in play go first
    const items = g === today ? [...g.items].sort((x, y) => (y.live ? 1 : 0) - (x.live ? 1 : 0)) : g.items;
    items.forEach(m => { html += matchRowHtml(m); });
  });
  return html;
}

    html += pageTitle((live ? liveTag : '') + `${COMPS[currentComp].name} - ${week.label || 'LIVE &amp; RESULTS'}`);
    if (!week.matches.length) {

    } else {
      if (!week.matches.some(m => m.live || m.final)) html += '<div class="page-note cyan">KICK-OFF TIMES SHOWN</div>';

        if (gl) html += '<hr class="sep">' + pageTitle('LATEST GOALS') + gl;
      }
    }
  } else {
    // Saved snapshot: only shown if the live feed has never loaded (or is down)
    html += pageTitle(`${COMPS[currentComp].name} - LATEST RESULTS`);
    html += matchRows(results, false);
  }
  html += pageFoot('results');
  document.getElementById('page-body').innerHTML = html;
}

const DAYS = { MON:'MONDAY', TUE:'TUESDAY', WED:'WEDNESDAY', THU:'THURSDAY', FRI:'FRIDAY', SAT:'SATURDAY', SUN:'SUNDAY' };
function splitWhen(w){
  const toks = String(w || '').replace(/,/g, '').trim().split(/\s+/).filter(Boolean);
  let time = '';
  if (toks.length && /^(\d{1,2}:\d{2}|TBC)$/.test(toks[toks.length - 1])) time = toks.pop();
  if (toks.length && DAYS[toks[0]]) toks[0] = DAYS[toks[0]];
  return { day: toks.join(' '), time };
}
function fixtureRows(list){
  const todayKey = londonToday();
  let html = '';
  groupByDay(list).forEach(g => {
    html += dayHead(g.day, g.key === todayKey);
    g.items.forEach(m => { html += matchRowHtml(m); });
  });
  return html;
}
function renderFixtures(){
  let html = pageTitle(`${COMPS[currentComp].name} - FIXTURES`);
  html += fixtures.length ? fixtureRows(fixtures) : emptyState('NO FIXTURES SCHEDULED YET.');
  html += pageFoot('fixtures');
  document.getElementById('page-body').innerHTML = html;
}

// Apply the scores of matches in play to the standings, re-sort, and flag
// the teams involved. Order: points, goal difference, then original order.
function applyLive(base, live){
  const rows = base.map(t => ({...t, inplay:false}));
  if(!live.length) return rows;
  const find = n => rows.find(r => r.team === n);
  live.forEach(m=>{
    const h = find(m.home), a = find(m.away);
    if(!h || !a) return;
    h.inplay = a.inplay = true;
    h.p++; a.p++;
    h.gd = (h.gd || 0) + m.hs - m.as;
    a.gd = (a.gd || 0) + m.as - m.hs;
    if(m.hs > m.as){ h.w++; h.pts += 3; a.l++; }
    else if(m.hs < m.as){ a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  const order = new Map(rows.map((r,i) => [r.team, i]));
  rows.sort((x,y) => y.pts - x.pts || (y.gd||0) - (x.gd||0) || order.get(x.team) - order.get(y.team));
  return rows;
}

function renderTable(){
  const isLive = liveMatches.length > 0;
  const rows = applyLive(table, liveMatches);
  let html = pageTitle((isLive ? liveTag : '') + `${COMPS[currentComp].name} - ${currentComp === 'pl' ? 'TABLE' : 'LEAGUE PHASE'}`);
  let notes = '';
  if (!rows.length) {
    html += emptyState('TABLE NOT AVAILABLE YET.');
  } else {
    const zones = currentComp === 'pl' ? { top: 4, bottom: 18, legend: 'GREEN=TOP 4 · RED=BOTTOM 3' } : { top: 8, bottom: 25, legend: 'GREEN=LAST 16 · 9-24 PLAY-OFF · RED=OUT' };
    html += `<div class="table-row head">
    <span></span><span>TEAM</span><span class="num">P</span><span class="num">W</span><span class="num">D</span><span class="num">PTS</span>
  </div>`;
    rows.forEach((t,i)=>{
      const rank = i+1;
      let cls = 'table-row';
      if(rank <= zones.top) cls += ' top4';
      if(rank >= zones.bottom) cls += ' bottom3';
      const name = teamHtml(t.team, t.inplay ? 13 : 14) + (t.inplay ? '<span class="red">&#9679;</span>' : '');
      html += `<div class="${cls}">
      <span class="rank">${rank}</span>
      <span>${name}</span>
      <span class="num">${t.p}</span>
      <span class="num">${t.w}</span>
      <span class="num">${t.d}</span>
      <span class="pts">${t.pts}</span>
    </div>`;
    });
    notes = `<div class="page-note green">${zones.legend}</div>` + (isLive ? '<div class="page-note red">&#9679; = MATCH IN PLAY</div>' : '');
  }
  html += pageFoot('table', notes);
  document.getElementById('page-body').innerHTML = html;
}

function goalLines(list){
  const items = [];
  list.forEach(m => {
    [['gh', m.home], ['ga', m.away]].forEach(([k, team]) => (m[k] || []).forEach(g => {
      const parts = String(g.t).split('+');
      items.push({ order: (parseInt(parts[0], 10) || 0) * 100 + (parseInt(parts[1], 10) || 0), g, team });
    }));
  });
  items.sort((x, y) => y.order - x.order);
  return items.slice(0, 8).map(({ g, team }) =>
    `<div class="goal-line"><span class="min">${g.t}'</span> ${g.p}${g.og ? ' (og)' : g.pen ? ' (pen)' : ''} <span class="tm">${teamHtml(team)}</span></div>`
  ).join('');
}

// --- Live data layer ---------------------------------------------------
// Pulls fresh data from our own /api/* serverless proxies (they hold the
// API-Football key server-side). On any failure the page keeps showing the
// last good data.
// API-Football uses full club names; the teletext grid wants short ones.
const SHORT = {
  "Manchester City":"Man City", "Manchester United":"Man United",
  "Nottingham Forest":"Nottm Forest", "Newcastle United":"Newcastle",
  "Brighton & Hove Albion":"Brighton", "Leeds United":"Leeds Utd", "Leeds":"Leeds Utd",
  "Tottenham Hotspur":"Tottenham", "AFC Bournemouth":"Bournemouth",
  "Ipswich Town":"Ipswich", "Coventry City":"Coventry",
  "Wolverhampton Wanderers":"Wolves", "West Ham United":"West Ham",
  "Sheffield United":"Sheff Utd",
  "Paris Saint Germain":"PSG", "Paris Saint-Germain":"PSG", "Bayern München":"Bayern", "Bayern Munich":"Bayern",
  "Borussia Dortmund":"Dortmund", "Bayer Leverkusen":"Leverkusen", "Atletico Madrid":"Atletico", "Atlético Madrid":"Atletico",
  "Eintracht Frankfurt":"Frankfurt", "Borussia Monchengladbach":"M'gladbach", "Club Brugge KV":"Club Brugge",
  "Olympiakos Piraeus":"Olympiacos", "Red Star Belgrade":"Red Star", "Sporting CP":"Sporting", "Internazionale":"Inter",
  "Real Sociedad":"R Sociedad", "Athletic Club":"Athletic", "Slavia Praha":"Slavia Prague", "Shakhtar Donetsk":"Shakhtar",
  "Union St. Gilloise":"Union SG", "Royale Union Saint-Gilloise":"Union SG", "PSV Eindhoven":"PSV", "Real Betis":"Betis",
  "Aston Villa":"Aston Villa", "Crystal Palace":"Crystal Palace"
};
const shortName = n => SHORT[n] || n;
const normMatch = m => ({...m, home: shortName(m.home), away: shortName(m.away)});

async function getJSON(url){
  try {
    const r = await fetch(url);
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) return { err: 'HTTP ' + r.status };
    if (!j || j.error) return { err: 'BAD DATA' };
    return { data: j };
  } catch (e) {
    return { err: 'NO CONNECTION' };
  }
}

async function fetchLive(){
  const comp = currentComp;
  const [w, f, t] = await Promise.all([
    getJSON('/api/matchweek?comp=' + comp), getJSON('/api/fixtures?comp=' + comp), getJSON('/api/table?comp=' + comp),
  ]);
  if (comp !== currentComp) return;   // the viewer switched competition while this was loading
  if (w.data && Array.isArray(w.data.matches)) {
    week = { label: w.data.label || '', matches: w.data.matches.map(normMatch) };
    liveMatches = week.matches.filter(m => m.live);
    apiErr.results = null;
  } else {
    week = null; liveMatches = [];   // never show stale in-play scores
    apiErr.results = w.err || 'NO DATA';
  }
  if (f.data && Array.isArray(f.data.fixtures)) {
    fixtures = f.data.fixtures.map(normMatch); apiErr.fixtures = null;
  } else apiErr.fixtures = f.err || 'NO DATA';
  if (t.data && Array.isArray(t.data.table)) {
    table = t.data.table.map(x => ({...x, team: shortName(x.team)})); apiErr.table = null;
  } else apiErr.table = t.err || 'NO DATA';
  loaded = true;
  if (!apiErr.results && !apiErr.fixtures && !apiErr.table) showSaved = false;
  renderCurrent();
  stampUpdated();
}
fetchLive();
setInterval(() => { if (document.visibilityState !== 'hidden') fetchLive(); }, 20000);

// --- Note dialog ---------------------------------------------------------
const noteEl = document.getElementById('note');
let noteOpener = null;
function showNote(key, opener){
  const n = NOTES[key]; if (!n) return;
  document.getElementById('note-title').textContent = n.title;
  document.getElementById('note-body').innerHTML = n.body;
  document.getElementById('note-src').textContent = n.src || '';
  noteOpener = opener || document.activeElement;
  noteEl.hidden = false;
  document.getElementById('tv').inert = true;
  document.getElementById('bar').inert = true;
  document.getElementById('note-close').focus();
}
function hideNote(){
  noteEl.hidden = true;
  document.getElementById('tv').inert = false;
  document.getElementById('bar').inert = false;
  if (noteOpener && document.contains(noteOpener)) noteOpener.focus();   // the page may have redrawn; then there is nothing to return to
  noteOpener = null;
}
// Called when the asterisk next to Man City is tapped or clicked.
function showCityNote(opener){ showNote('city', opener); }

document.addEventListener('click', (e) => {
  const star = e.target.closest && e.target.closest('.city-star');
  if (star) { showCityNote(star); return; }
  const clk = e.target.closest && e.target.closest('#clock');
  if (clk) { showNote('clock', clk); return; }
  const pn = e.target.closest && e.target.closest('#page-num');
  if (pn) { NOTES.page.title = 'LIVE FROM ' + pn.textContent.trim(); showNote('page', pn); return; }
  if (e.target === noteEl || e.target.id === 'note-close') hideNote();
});

// --- Competition tabs ---------------------------------------------------
const compBtns = Array.from(document.querySelectorAll('#comps button'));
const compCache = {};   // remembers each competition's data while you flick between tabs
function showCompTabs(){
  compBtns.forEach(b => {
    const on = b.dataset.comp === currentComp;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}
function switchComp(c){
  if (!isComp(c) || c === currentComp) return;
  compCache[currentComp] = { week, liveMatches, fixtures, table, apiErr: {...apiErr}, loaded };
  currentComp = c;
  const st = compCache[c] || { week: null, liveMatches: [], fixtures: [], table: [], apiErr: { results: null, fixtures: null, table: null }, loaded: false };
  ({ week, liveMatches, fixtures, table, loaded } = st);
  Object.assign(apiErr, st.apiErr);
  showSaved = false;
  try { history.replaceState(null, '', c === 'pl' ? location.pathname + location.search : '#' + c); } catch (e) {}
  showCompTabs();
  renderCurrent();
  fetchLive();
}
compBtns.forEach(b => b.addEventListener('click', () => switchComp(b.dataset.comp)));
window.addEventListener('hashchange', () => { const c = location.hash.slice(1); if (isComp(c)) switchComp(c); });
showCompTabs();

// Buttons on the error page
document.getElementById('page-body').addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if (b.dataset.action === 'retry') { b.textContent = 'RETRYING...'; fetchLive(); }
  else if (b.dataset.action === 'saved') { showSaved = true; renderCurrent(); }
});

// Matches in play: poll every 20s while the tab is visible. Updates the
// LIVE NOW block on the results page and the LIVE TABLE on the table page.
// --- Fit to viewport (iPhone Duo: cover ~382px wide, inner up to ~951px) ---
// Re-runs whenever the viewport changes, so folding/unfolding or rotating
// rescales the page live.
const tvEl = document.getElementById('tv');
function fitTV(){
  const cs = getComputedStyle(document.body);
  const avail = document.body.clientWidth
    - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const k = Math.max(0.6, Math.min(avail / 480, 2.0));
  document.documentElement.style.setProperty('--k', k.toFixed(3));
}
fitTV();
window.addEventListener('resize', fitTV);
window.addEventListener('orientationchange', fitTV);

// --- Keyboard + accessibility (Mac, iPad keyboards, Vision Pro, VoiceOver) ---
// Type a page number (302, 303, 301), press R/G/Y for the coloured FastText buttons,
// P/U/E/F for Premier / Champions / Europa / Conference League, or use the arrow keys to flip pages.
const pageBtns = Array.from(document.querySelectorAll('#nav button'));
function markCurrent(btn){
  pageBtns.forEach(b => b.removeAttribute('aria-current'));
  btn.setAttribute('aria-current', 'page');
}
pageBtns.forEach(b => b.addEventListener('click', () => markCurrent(b)));
markCurrent(pageBtns[0]);
let typedDigits = '', typedTimer;
window.addEventListener('keydown', (e) => {
  if (!noteEl.hidden) {
    if (e.key === 'Escape') hideNote();
    else if (e.key === 'Tab') { e.preventDefault(); document.getElementById('note-close').focus(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const colourKeys = { r: 0, g: 1, y: 2, c: 3, w: 4 };
  const key = e.key.toLowerCase();
  if (/^[0-9]$/.test(key)) {
    typedDigits += key;
    clearTimeout(typedTimer);
    typedTimer = setTimeout(() => { typedDigits = ''; }, 2000);
    if (typedDigits.length === 3) {
      const hit = pageBtns.find(b => b.dataset.num === typedDigits);
      typedDigits = '';
      if (hit) hit.click();
    }
  } else if (({ p: 'pl', u: 'ucl', e: 'uel', f: 'uecl' })[key]) {
    switchComp(({ p: 'pl', u: 'ucl', e: 'uel', f: 'uecl' })[key]);
  } else if (key in colourKeys && pageBtns[colourKeys[key]]) {
    pageBtns[colourKeys[key]].click();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const cur = pageBtns.findIndex(b => b.getAttribute('aria-current') === 'page');
    const step = e.key === 'ArrowRight' ? 1 : -1;
    pageBtns[(cur + step + pageBtns.length) % pageBtns.length].click();
  }
});
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitTV);
